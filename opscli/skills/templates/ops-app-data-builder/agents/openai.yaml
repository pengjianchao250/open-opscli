interface:
  display_name: "OPS 应用数据层构建"
  short_description: "为已初始化的 opscli app 站点构建真实业务数据层"
  default_prompt: "使用 $ops-app-data-builder 为当前已完成标准模板初始化的 opscli app 站点构建真实业务数据层，先校验 binding、QueryGateway 和 app.yaml 数据集白名单，再验证 OPS 用户隔离、Keepa 同步调用、SellerSprite 异步任务及共享快照合同，并生成后端、前端 API、SQLite 迁移、测试和 data-spec。"

policy:
  allow_implicit_invocation: true
