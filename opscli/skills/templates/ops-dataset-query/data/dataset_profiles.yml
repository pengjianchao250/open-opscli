      - "只包含SB广告，不包含SBV"
      - "不默认承诺部门、ASIN、SKU完整粒度；需要先校验字段"
    clarify_when:
      - "用户问SBV明细"
      - "用户需要部门、ASIN、SKU维度"
    avoid_when:
      - "非亚马逊平台"
      - "SBV明细"

