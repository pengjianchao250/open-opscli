version: "v1.2"
artifact: "dataset_profiles"
skill: "ops-dataset-query"
based_on: "intent_taxonomy.yml v1.2"
purpose: "将数据集画像升级为结构化索引，用于根据业务意图选择数据集、识别执行口径、推荐维度指标并拦截不适用场景。"

schema:
  standard_name: "业务侧标准数据集名称"
  routing_status: "direct_intent=可由业务意图直接路由；embedded_intent=保留意图但执行时映射到父数据集"
  intent_ids: "关联的业务意图ID"
  table_id: "查询服务 table_id；当前无独立入口则为 null"
  dataset_alias: "查询服务 dataset_alias；当前无独立入口则为 null"
  dataset_name: "元数据或实际表口径名称"
  domain: "业务域"
  min_grain: "数据最小颗粒度"
  time_basis: "默认时间口径"
  source_or_join_rule: "主表、嵌入口径或链接规则"
  best_for: "最适合的业务场景"
  default_dimensions: "默认推荐维度"
  default_metrics: "默认推荐指标"
  hard_constraints: "必须遵守的硬约束"
  clarify_when: "必须澄清的场景"
  avoid_when: "不适用场景"

datasets:
  - standard_name: "即时综合数据集"
    routing_status: "direct_intent"
    intent_ids: [ops_comprehensive_monitoring]
    table_id: 1
    dataset_alias: "ds_d35ac6f3910c"
    dataset_name: "order_sale_trend_adv_traffic_inv_set"
    domain: "综合运营域"
    min_grain: "部门 + 渠道 + 渠道SKU + 天"
    time_basis: "天；销售主口径来自 BI系统即时销量趋势"
    source_or_join_rule: "BI系统即时销量趋势为主，补充广告、流量和库存快照相关字段"
    best_for: "销售、广告、流量、库存联动的综合运营监控"
    default_dimensions: [日期, 部门, 大组, 销售小组, 销售, 开发, 平台, 国家, 渠道, ASIN, 公司SKU, 渠道SKU, SPU]
    default_metrics: [销售额, 销量, 订单数, 毛利, 毛利率, 广告费, 广告销售额, ACOS, 点击量, 曝光量, 平均CPC, 流量, 转化率, 总库存]
    hard_constraints:
      - "开发类型、SKU等级、物控编码等级、父公司SKU、风格化名称、保护等级(风格化)字段仅项目二部专属维度可用"
      - "已售天数字段只能用于明细表或无聚合过滤条件"
      - "总库存、海外仓库存、在途库存、国内库存、采购库存、待销毁库存属于库存快照字段，只能用于明细表或无聚合过滤条件"
      - "平均CPC、SP平均CPC、SD平均CPC、SB平均CPC、SBV平均CPC按广告费/点击量计算，广告费取 BI系统即时销量趋势中的相应广告费字段"
      - "转化率按订单销量/流量计算，订单销量取 BI系统即时销量趋势中的订单销量字段"
    clarify_when:
      - "用户只问销售、广告、流量、库存单一业务域时，需判断是否转专项意图"
      - "用户要求库存字段做聚合分析时，需说明库存快照字段限制"
    avoid_when:
      - "亚马逊广告活动、广告组等明细深挖"
      - "亚马逊目录绩效或搜索词绩效"
      - "纯物控库存、库龄、补货计划分析"

  - standard_name: "即时销售数据集"
    routing_status: "embedded_intent"
    intent_ids: [realtime_sales_monitoring]
    table_id: null
    dataset_alias: null
    dataset_name: null
    actual_source: "order_sale_trend_set"
    parent_dataset: "即时综合数据集"
    execution_dataset: "即时综合数据集"
    domain: "销售分析域"
    min_grain: "部门 + 渠道 + 渠道SKU + 天"
    time_basis: "订单下单时间"
    source_or_join_rule: "保留即时销售业务意图；执行时使用即时综合数据集中的 order_sale_trend_set 销售主表口径"
    best_for: "今日、实时、近几天、大促期间销售监控和异常波动排查"
    default_dimensions: [日期, 部门, 大组, 销售小组, 销售, 平台, 国家, 渠道, ASIN, 公司SKU, 渠道SKU, SPU]
    default_metrics: [销售额, 销量, 订单数, 自发货销量, 平台发货销量, 退款金额, 毛利, 毛利率, 总库存]
    hard_constraints:
      - "当前无独立 dataset_alias；后续开放独立入口后再补 dataset_alias/table_id"
      - "已售天数字段只能用于明细表或无聚合过滤条件"
      - "总库存字段属于库存快照字段，只能用于明细表或无聚合过滤条件"
    clarify_when:
      - "用户要求独立即时销售数据集入口"
      - "用户未说明看订单下单时间还是包裹发货时间"
    avoid_when:
      - "月度、季度、年度账单销售复盘"

  - standard_name: "账单销售数据集"
    routing_status: "direct_intent"
    intent_ids: [billing_sales_review]
    table_id: 2
    dataset_alias: "ds_9e288aa0df06"
    dataset_name: "sale_trend_set"
    domain: "销售分析域"
    min_grain: "部门 + 渠道 + 渠道SKU + 天"
    time_basis: "包裹发货时间"
    source_or_join_rule: "sale_trend_set 对应账单销售数据集；以 BI系统销售趋势为主，可补充库存快照字段"
    best_for: "月度、季度、年度销售复盘、趋势分析、销售预测和目标考核"
    default_dimensions: [日期, 周, 月, 季度, 年度, 部门, 大组, 销售小组, 销售, 平台, 国家, 渠道, ASIN, 公司SKU, 渠道SKU]
    default_metrics: [销售额, 销量, 订单数, 毛利, 毛利率, 退款金额, 退款量, 采购成本, 运费, 手续费, 仓租]
    hard_constraints:
      - "已售天数字段只能用于明细表或无聚合过滤条件"
      - "总库存字段属于库存快照字段，只能用于明细表或无聚合过滤条件"
    clarify_when:
      - "用户未说明看订单下单时间还是包裹发货时间"
    avoid_when:
      - "今日、实时、大促、短期波动销售监控"

  - standard_name: "广告费数据集"
    routing_status: "direct_intent"
    intent_ids: [ads_overall]
    table_id: 12
    dataset_alias: "ds_bnEtG5ehYA6N"
    dataset_name: "advertising_list_set"
    domain: "广告投放域"
    min_grain: "部门 + 渠道 + 渠道SKU + 天"
    time_basis: "天"
    source_or_join_rule: "BI系统广告费左链接即时销量趋势，以 BI系统广告费为主"
    best_for: "全平台、全广告类型的汇总级广告表现总览和跨平台对比；非亚马逊广告查询也回到该数据集"
    default_dimensions: [日期, 平台, 国家, 渠道, 部门, 小组, 销售, 开发, ASIN, 公司SKU, 渠道SKU]
    default_metrics: [广告费, 广告销售额, 广告销量, 点击量, 曝光量, ACOS, 点击率, 平均CPC, CPC转化率, 总销售额, 总销量]
    hard_constraints:
      - "包含SP、SD、SB、SBV类型广告相关汇总字段和销售字段"
      - "总销售额和总销量字段来自即时销量趋势数据集"
      - "已售天数字段只能用于明细表或无聚合过滤条件"
      - "非亚马逊平台广告明细只能使用该数据集；如字段不支持明细粒度，必须说明限制"
    clarify_when:
      - "用户要求单广告活动、单广告组、关键词、搜索词、投放词或受众组级别分析"
    avoid_when:
      - "亚马逊SP/SD/SB广告深度明细"
      - "广告类型投入结构拆解"

  - standard_name: "广告类型费数据集"
    routing_status: "direct_intent"
    intent_ids: [ads_type_compare, amazon_sbv_summary]
    table_id: 15
    dataset_alias: "ds_YRzc8pqOX2Fx"
    dataset_name: "custom_type_advertising_list"
    metadata_display_name: "广告类型花费数据集"
    domain: "广告投放域"
    min_grain: "部门 + 渠道 + 渠道SKU + 天 + 广告类型"
    time_basis: "天"
    source_or_join_rule: "BI系统广告费左链接即时销量趋势，以 BI系统广告费为主，并按广告类型拆分"
    best_for: "分平台、分广告类型的SP/SD/SB/SBV投入占比、ACOS、CPC、转化率等中观对比"
    default_dimensions: [日期, 平台, 国家, 渠道, 广告类型, 部门, 小组, ASIN, 公司SKU, 渠道SKU]
    default_metrics: [广告费, 广告销售额, 广告销量, 点击量, 曝光量, ACOS, 点击率, 平均CPC, CPC转化率, 总销售额, 总销量, 总销售额分摊, 总销量分摊]
    hard_constraints:
      - "总销售额和总销量字段来自即时销量趋势数据集"
      - "总销售额(分摊)和总销量(分摊)按各广告类型广告费比例分摊"
      - "SBV只能在该数据集或广告费数据集做汇总分析，不进入SB广告明细"
      - "不用于广告活动、广告组、关键词、搜索词、投放词或受众组明细"
    clarify_when:
      - "用户需要SP、SD、SB单类型深度明细"
      - "用户要求SBV明细"
    avoid_when:
      - "公司级全平台广告总览"

  - standard_name: "SP广告数据集"
