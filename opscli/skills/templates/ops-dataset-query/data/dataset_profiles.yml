    best_for: "亚马逊SD展示、再营销、新买家、加购、视频播放等明细分析"
    default_dimensions: [日期, 部门, 渠道, 渠道SKU, ASIN, 广告活动, 广告组, 策略]
    default_metrics: [曝光量, 可见展示次数, 点击量, 花费, 广告订单量, 广告销售额, 新买家销量, 新买家销售额, 视频播放, 品牌搜索, 加购物, ACOS, ROAS]
    hard_constraints:
