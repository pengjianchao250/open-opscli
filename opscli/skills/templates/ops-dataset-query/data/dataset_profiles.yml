    source_or_join_rule: "SP广告数据集、SD广告数据集和SB广告数据集合并，合并后字段与SD广告数据集一致"
    best_for: "亚马逊SP+SD+SB全广告类型合并分析"
    default_dimensions: [日期, 广告类型, 渠道, 广告活动ID, 广告活动, 广告组, 平台, 国家]
    default_metrics: [曝光量, 可见展示次数, 点击量, 花费, 广告订单量, 广告销量, 广告销售额, 新买家销量, 新买家销售额, ACOS, ROAS]
