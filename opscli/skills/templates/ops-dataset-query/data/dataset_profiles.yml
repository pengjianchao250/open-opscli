    intent_ids: [amazon_sp_ads_detail]
    table_id: 22
    dataset_alias: "ds_1U7bcb5Z0ja8"
    dataset_name: "custom_sp_ads_set"
    domain: "广告投放域"
    min_grain: "部门 + 渠道 + 渠道SKU + 天"
    time_basis: "天"
