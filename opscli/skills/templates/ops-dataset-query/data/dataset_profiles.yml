    hard_constraints:
      - "仅亚马逊平台可用"
      - "只包含广告活动和广告组相关数据"
      - "不包含搜索词、关键词、投放词等词组数据；相关分析必须澄清"
    clarify_when:
      - "SP可能指产品SPU而不是Sponsored Products"
      - "用户要求搜索词、关键词、投放词或词组分析"
    avoid_when:
      - "非亚马逊平台"
      - "SP词组分析"

