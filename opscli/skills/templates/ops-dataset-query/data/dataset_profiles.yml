    default_dimensions: [日期, 广告类型, 部门, 渠道, 渠道SKU, ASIN, 广告活动, 广告组]
    default_metrics: [曝光量, 点击量, 花费, 广告订单量, 广告销量, 广告销售额, ACOS, ROAS]
    hard_constraints:
      - "仅亚马逊平台可用"
      - "只问SP或只问SD时，应使用对应单类型数据集"
    clarify_when:
      - "用户未明确是否需要SP+SD合并口径"
    avoid_when:
