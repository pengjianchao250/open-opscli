version: "v1.2"
artifact: "dataset_relationships"
skill: "ops-dataset-query"
based_on: "intent_taxonomy.yml v1.2"
purpose: "补充数据集关联关系图，用于识别主从链接、嵌入口径、下钻、合并和回退关系。"

relationships:
  - from: "order_sale_trend_set"
    to: "即时综合数据集"
    type: "primary_table"
    rule: "即时综合数据集以 BI系统即时销量趋势为主表"

  - from: "order_sale_trend_set"
    to: "即时销售数据集"
    type: "embedded_source"
    rule: "即时销售意图保留，但执行时使用即时综合数据集中的 order_sale_trend_set 口径"

  - from: "广告费数据集"
    to: "即时综合数据集"
    type: "left_join_supplement"
    rule: "广告字段补充到即时综合，不能反向改变即时销量趋势主表范围"

  - from: "流量转化率数据集"
    to: "即时综合数据集"
    type: "left_join_supplement"
    rule: "流量、浏览量、转化率等字段补充到即时综合"

  - from: "sale_trend_set"
    to: "账单销售数据集"
    type: "primary_table"
    rule: "sale_trend_set 对应账单销售数据集，以包裹发货时间分析"

  - from: "即时销售数据集"
    to: "账单销售数据集"
    type: "alternative_by_time_basis"
    rule: "订单下单时间、今日、实时、短期波动看即时销售；包裹发货时间、月度、季度、年度复盘看账单销售"

  - from: "广告费数据集"
    to: "广告类型费数据集"
    type: "drilldown_by_ad_type"
    rule: "先用广告费数据集做全平台广告总览，再用广告类型费数据集拆解SP/SD/SB/SBV类型结构"

  - from: "广告类型费数据集"
    to: "SP广告数据集"
    type: "amazon_detail_drilldown"
    rule: "亚马逊SP类型需要广告活动或广告组明细时下钻到SP广告数据集"

  - from: "广告类型费数据集"
    to: "SD广告数据集"
    type: "amazon_detail_drilldown"
    rule: "亚马逊SD类型需要明细时下钻到SD广告数据集"

  - from: "广告类型费数据集"
    to: "SB广告数据集"
    type: "amazon_detail_drilldown"
    rule: "亚马逊SB类型需要明细时下钻到SB广告数据集；不包含SBV"

  - from: "广告类型费数据集"
    to: "SBV汇总分析"
    type: "supported_summary_only"
    rule: "SBV只做广告类型汇总，不走SB广告数据集明细"

  - from: "广告费数据集"
    to: "非亚马逊广告明细意图"
    type: "forced_fallback"
    rule: "非亚马逊平台广告明细只能回到广告费数据集；如字段不支持明细粒度，必须说明限制"

  - from: "SP广告数据集"
    to: "SP+SD广告数据集"
    type: "merge_source"
    rule: "SP+SD合并表来源之一"

  - from: "SD广告数据集"
    to: "SP+SD广告数据集"
    type: "merge_source"
    rule: "SP+SD合并表来源之一"

  - from: "SP广告数据集"
    to: "SP+SD+SB广告数据集"
    type: "merge_source"
    rule: "SP+SD+SB合并表来源之一"

  - from: "SD广告数据集"
    to: "SP+SD+SB广告数据集"
    type: "merge_source"
    rule: "SP+SD+SB合并表来源之一"

  - from: "SB广告数据集"
    to: "SP+SD+SB广告数据集"
    type: "merge_source"
    rule: "SP+SD+SB合并表来源之一；不包含SBV明细"

  - from: "SP广告数据集"
    to: "SP词组分析"
    type: "unsupported_currently"
    rule: "当前SP广告数据集不包含搜索词、关键词、投放词；后续新增词组数据集后再补路由"

  - from: "亚马逊目录绩效"
    to: "亚马逊搜索词绩效"
    type: "same_report_period_family"
    rule: "两者都要求报告周期；目录看ASIN目录表现，搜索词绩效看搜索词份额"

  - from: "物控版库存周转"
    to: "库存管理域"
    type: "direct_inventory_intent"
    rule: "当前库存管理域只保留物控库存、库龄、补货分析意图"

  - from: "活动数据集"
    to: "即时销售数据集"
    type: "optional_joint_analysis"
    rule: "活动销售增量需联动即时销售口径，不可只用活动数据集"

  - from: "活动数据集"
    to: "账单销售数据集"
    type: "optional_joint_analysis"
    rule: "长周期活动复盘可联动账单销售口径"

mermaid: |
  flowchart TD
    A["BI系统即时销量趋势 / order_sale_trend_set"] --> B["即时综合数据集"]
    C["广告费数据集"] --> B
    D["流量转化率数据集"] --> B
    A --> F
    G["sale_trend_set"] --> H
    F -. "订单下单时间" .- H
    H -. "包裹发货时间" .- F

    C --> I["广告类型费数据集"]
    I --> J["SP广告数据集"]
    I --> L["SD广告数据集"]
    I --> N["SB广告数据集"]
    I -. "SBV类型汇总" .-> O["SBV汇总分析"]
    N -. "不包含SBV" .-> O
    C -. "非亚马逊广告明细回退" .-> C

    J --> K["SP+SD广告数据集"]
    L --> K
    J --> M["SP+SD+SB广告数据集"]
    L --> M
    N --> M
    J -. "不支持搜索词/关键词/投放词" .-> P["SP词组分析待新增数据集"]

    Q["亚马逊目录绩效"] -. "报告周期必选" .- R["亚马逊搜索词绩效"]
    S["物控版库存周转"] --> T["库存管理域当前直接意图"]
    V["活动数据集"] -. "销售增量需联动" .- F
    V -. "长周期复盘可联动" .- H
