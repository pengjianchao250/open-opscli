version: "v1.2"
artifact: "field_semantic_index"
skill: "ops-dataset-query"
based_on: "intent_taxonomy.yml v1.2"
purpose: "将用户自然语言中的业务术语映射为候选字段、候选数据集、口径说明和澄清规则，避免只做关键词搜索导致误选字段或误选数据集。"

global_semantic_rules:
  default_currency: "CNY"
  formula_metrics_no_extra_aggregation: true
  amount_original_currency_keywords: [原币, 美金, 美元, USD, 站点币种]
  amount_cny_keywords: [人民币, CNY, 本币]
  output_field_name_rule: "输出字段名必须使用数据集原始 verbose_name，不得自行改写。"
  field_check_rule: "字段语义索引只负责候选推荐，构造查询前仍必须通过 metadata 或 dataset_fields.csv 校验字段真实存在。"

semantic_groups:
  organization_fields:
    description: "组织、人员和角色字段。销售组织、开发组织、物控组织不能混用。"
    canonical_terms:
      部门:
        common_fields: [dept_name]
        clarify_when:
          - "用户提到部门值时，需要通过查询组件确认权限枚举。"
      大组:
        common_fields: [large_team_name]
        clarify_when:
          - "物控数据集中的集团销售大组不是普通销售大组。"
      销售小组:
        common_fields: [team_name]
        inventory_pmc_fields: [sale_group_name]
        clarify_when:
          - "普通销售小组和物控集团销售小组不能直接混用。"
      销售:
        common_fields: [team_username]
        clarify_when:
          - "用户只给人名时，需要确认是销售还是开发。"
      开发小组:
        common_fields: [dev_team_name]
      开发:
        common_fields: [develop_username]
      物控组织:
        inventory_pmc_fields: [org_name, large_sale_group_name, sale_group_name]
        clarify_when:
          - "用户问物控、补货、库龄时优先物控版库存周转，不按普通销售组织直接套用。"

  platform_fields:
    description: "平台维度字段。不同平台的枚举值由查询组件动态提供，禁止硬编码假设平台范围。"
    canonical_terms:
      平台:
        common_fields: [platform_name]
        clarify_when:
          - "用户未指定平台时，不加平台过滤，返回全平台数据。"
          - "用户提到的平台名称不在查询组件枚举值中时，需告知当前系统不支持，展示可用平台列表。"
    platform_name_mapping:
      口语到枚举值映射:
        亚马逊: [Amazon SC, Amazon VC]
        Amazon SC: [Amazon SC]
        Amazon VC: [Amazon VC]
        抖音: [Tiktok]
        海外版抖音: [Tiktok]
        Tiktok: [Tiktok]
        TikTok Shop: [Tiktok]
        速卖通: [速卖通]
        AliExpress: [速卖通]
        独立站: [Shopify]
        Shopify: [Shopify]
    hard_rules:
      - "平台枚举值以查询组件数据集返回的实际值为准，上述映射仅为常见口语映射。"
      - "用户未指定平台时，不加 platform_name 过滤条件，返回全平台数据。"
      - "用户指定平台时，必须先通过查询组件校验该值在枚举值中存在。"
      - "亚马逊平台映射为 Amazon SC + Amazon VC 两个值，查询时需同时过滤。"
      - "亚马逊广告明细数据集（SP/SD/SB 等）仅包含亚马逊平台数据，这是数据源限制，不是规则限制。"

  product_identity_fields:
    description: "产品标识字段。ASIN、父ASIN、公司SKU、渠道SKU、SPU、物控编码、型号需区分。"
    canonical_terms:
      ASIN:
        common_fields: [asin]
      父ASIN:
        common_fields: [parent_asin]
      公司SKU:
        common_fields: [ed_sku]
      渠道SKU:
        common_fields: [sell_sku]
      SPU:
        common_fields: [spu]
        routing_rule: "SPU仅作为产品维度字段处理；按销售问题的时间口径选择即时销售、账单销售或即时综合，并校验字段存在。"
        clarify_when:
          - "用户只说SP，无法判断是SPU产品编码还是Sponsored Products广告。"
          - "用户明确要求SPU维度但目标销售数据集未确认存在SPU字段。"
      物控编码:
        common_fields: [pmc_code]
      产品型号:
        common_fields: [model]
      UPC:
        common_fields: [upc]
      产品名称:
        common_fields: [product_name]
    ambiguity_rules:
      - term: "SP"
        possible_meanings:
          - "SPU产品编码"
          - "Sponsored Products广告"
        resolve_rule: "广告语境优先识别为SP广告；产品销售语境按销售意图选即时/账单/综合并校验SPU字段；无法判断时必须澄清。"

  time_fields:
    description: "日期、报告周期和活动时间字段。"
    canonical_terms:
      日期:
        common_fields: [date_id]
      订单下单时间:
        intent_id: realtime_sales_monitoring
        dataset: "即时销售数据集"
        execution_dataset: "即时综合数据集"
        actual_source: "order_sale_trend_set"
      包裹发货时间:
        intent_id: billing_sales_review
        dataset: "账单销售数据集"
        actual_source: "sale_trend_set"
      报告周期:
        common_fields: [report_period]
        required_for_datasets: [亚马逊目录绩效, 亚马逊搜索词绩效]
        clarify_when:
          - "查询亚马逊目录绩效或亚马逊搜索词绩效时，用户未提供报告周期。"
      活动开始时间:
        common_fields: [start_date, start_date_cn]
      活动结束时间:
        common_fields: [end_date, end_date_cn]
    hard_rules:
      - "即时销售意图按订单下单时间分析。"
      - "账单销售意图按包裹发货时间分析。"
      - "物控版库存周转如果查询日期区间，维度必须包含日期天字段。"
      - "物控版库存周转最新日期为昨天。"

  sales_metrics:
    description: "销售、订单、利润、退款和成本相关指标。"
    canonical_metrics:
      销售额:
        preferred_by_intent:
          realtime_sales_monitoring: {dataset: 即时销售数据集, execution_dataset: 即时综合数据集, field: price}
          billing_sales_review: {dataset: 账单销售数据集, field: price}
          ops_comprehensive_monitoring: {dataset: 即时综合数据集, field: price}
          traffic_conversion: {dataset: 流量转化率数据集, field: ordered_product_sales_cny}
        clarify_when:
          - "用户问广告销售额时，不应使用销售额字段，应转广告销售额语义。"
          - "用户未说明订单下单时间还是包裹发货时间，且时间口径会影响结果。"
      销量:
        preferred_fields: [order_qty, units_ordered]
        variants: [order_qty_ds, order_qty_dp]
        clarify_when:
          - "用户需要区分自发货/平台发货销量。"
      订单数:
        preferred_fields: [orders]
      毛利:
        preferred_fields: [gross_profit]
      毛利率:
        preferred_fields: [gross_profit_percent]
        formula_metric: true
      退款:
        preferred_fields: [refund, refund_qty, refund_percent]
        clarify_when:
          - "用户未说明看退款金额、退款量还是退款占比。"
      成本费用:
        preferred_fields: [purchase_cost, fee, freight, storage_charges, first_leg, transport_fee]
        clarify_when:
          - "用户只说成本时，需要确认采购成本、手续费、运费、仓租、头程或转运费。"

  advertising_metrics:
    description: "广告汇总、广告类型和亚马逊广告明细字段。"
    dataset_selection_rules:
      overall: "广告整体、跨平台、全广告类型总览优先广告费数据集。"
      type_compare: "SP/SD/SB/SBV广告类型结构和效果对比优先广告类型费数据集。"
      amazon_detail: "SP/SD/SB/SP+SD/SP+SD+SB明细仅亚马逊平台可用。"
      non_amazon_detail: "非亚马逊平台广告明细只能使用广告费数据集；若字段不支持明细粒度，需要说明限制。"
      sbv: "SBV只有汇总分析，不走SB广告数据集。"
    canonical_metrics:
      广告费:
        fields_by_dataset:
          即时综合数据集: [advertising_fee, ads_sp, ads_sd, ads_sb, ads_sbv]
          账单销售数据集: [advertising_fee, ads_sp, ads_sd, ads_sb, ads_sbv]
          广告费数据集: [ads_total_spend_cny, sp_total_spend_cny, sd_total_spend_cny, sb_total_spend_cny, sbv_total_spend_cny]
          广告类型费数据集: [total_spend_cny]
          SP广告数据集: [cost_cny]
          SD广告数据集: [cost_cny]
          SB广告数据集: [cost_cny]
      广告销售额:
        fields_by_dataset:
          即时综合数据集: [ads_sales_cny]
          广告费数据集: [ads_sales_cny, sp_sales_cny, sd_sales_cny, sb_sales_cny, sbv_sales_cny]
          广告类型费数据集: [sales_cny]
          SP广告数据集: [sales_cny, sales_promoted_clicks_cny, sales_indirect_cny]
          SD广告数据集: [sales_cny, sales_clicks_cny, sales_promoted_clicks_cny, sales_indirect_cny]
          SB广告数据集: [sales_cny, sales_promoted_clicks_cny, sales_indirect_cny]
      广告销量:
        fields_by_dataset:
          广告费数据集: [ads_conversions, sp_conversions, sd_conversions, sb_conversions, sbv_conversions]
          广告类型费数据集: [conversions]
          SP广告数据集: [units_sold, units_sold_promoted_clicks, units_sold_indirect]
          SD广告数据集: [units_sold, new_to_brand_units_sold]
          SB广告数据集: [units_sold, units_sold_clicks, new_to_brand_units_sold]
      点击量:
        preferred_fields: [ads_clicks, clicks]
      曝光量:
        preferred_fields: [ads_impressions, impressions]
      ACOS:
        preferred_fields: [ads_acos, sp_acos, sd_acos, sb_acos, sbv_acos, acos]
        formula_metric: true
        clarify_when:
          - "ACOS跨多个广告数据集存在，需按广告总览、广告类型或广告明细粒度选择数据集。"
      ROAS:
        preferred_fields: [roas]
        formula_metric: true
        only_in_datasets: [SP广告数据集, SD广告数据集, SB广告数据集, SP+SD广告数据集, SP+SD+SB广告数据集]
      平均CPC:
        preferred_fields: [ads_cpc_avg_cny, sp_cpc_avg_cny, sd_cpc_avg_cny, sb_cpc_avg_cny, sbv_cpc_avg_cny, cpc_avg_cny]
        formula_metric: true
        special_rules:
          - "即时综合数据集的平均CPC类字段使用即时销量趋势中的广告费字段计算，不来自广告费数据集。"
      点击率:
        preferred_fields: [ads_clicks_percent, clicks_percent]
        formula_metric: true
      CPC转化率:
        preferred_fields: [ads_cpc_percent, cpc_percent]
        formula_metric: true
      广告类型:
        preferred_fields: [ads_type, ad_type]
        clarify_when:
          - "需要从查询组件确认SP、SD、SB、SBV的标准枚举值。"
    unsupported_or_limited:
      SP词组分析:
        rule: "SP广告数据集不包含搜索词、关键词、投放词；当前不在该数据集执行词组分析。"
      SBV明细:
        rule: "SB广告数据集不包含SBV；SBV仅走广告费数据集或广告类型费数据集做汇总分析。"
      非亚马逊广告明细:
        rule: "非亚马逊平台广告明细只能回广告费数据集；若字段不支持活动/广告组粒度，应提示限制。"

  traffic_metrics:
    description: "流量、浏览量和转化率字段。"
    canonical_metrics:
      流量:
        preferred_fields: [sessions]
      移动端流量:
        preferred_fields: [sessions_mobile_app]
      浏览器流量:
        preferred_fields: [sessions_browser]
      浏览量:
        preferred_fields: [page_views, page_views_mobile_app, page_views_browser]
      转化率:
        preferred_fields: [convert_percent, conversion_percent]
        formula_metric: true
        clarify_when:
          - "销售主口径转化率优先即时综合数据集；ASIN流量转化口径优先流量转化率数据集。"

  catalog_and_search_metrics:
    description: "亚马逊目录绩效和搜索词绩效字段。"
    catalog_performance:
      required_dimension: report_period
      fields: [impression_count, click_count, click_rate, cart_add_count, cart_add_rate, purchase_count, purchase_rate, search_traffic_sales_amount_cny]
    search_query_performance:
      required_dimensions: [report_period, search_query]
      fields: [search_query_score, search_query_volume, total_click_count, total_click_rate, asin_click_count, asin_click_share, total_cart_add_count, asin_cart_add_share, total_purchase_count, asin_purchase_share]
    clarify_when:
      - "用户未提供报告周期。"
      - "用户说关键词但无法判断是自然搜索词绩效还是广告关键词。"

  inventory_metrics:
    description: "库存数量、库龄和周转字段。当前直接业务意图保留物控库存、库龄与补货分析。"
    dataset_selection_rules:
      sales_or_comprehensive_snapshot: "销售或综合分析中使用总库存、海外仓库存、在途库存等字段时，优先即时综合数据集；这些字段属于库存快照字段，只能用于明细表或无聚合过滤条件。"
      pmc_inventory: "物控、库龄、补货、近7天销量、近30天销量优先物控版库存周转。"
    canonical_metrics:
      总库存:
        fields_by_dataset:
          即时综合数据集: [total_qty]
          即时销售数据集: [total_qty]
          账单销售数据集: [total_qty]
        snapshot_metric: true
        hard_rule: "只能用于明细表或无聚合过滤条件。"
      海外仓库存:
        fields_by_dataset:
          即时综合数据集: [oversea_qty, platform_qty]
          物控版库存周转: [platform_quantity, fba_saleable_inventory, fba_unsaleable_inventory]
      可售库存:
        fields_by_dataset:
          物控版库存周转: [fba_saleable_inventory, wmt_saleable_inventory, wayfair_saleable_inventory, other_platform_saleable_inventory]
      在途库存:
        fields_by_dataset:
          即时综合数据集: [intransit_qty]
          物控版库存周转: [second_leg_inventory, air_transport_inventory, sea_transport_inventory, purchase_order_on_passage_inventory, transit_quantity]
      库龄:
        fields_by_dataset:
          物控版库存周转: [within90days_inventory_quantity, over90days_inventory_quantity, over180days_inventory_quantity, over365days_inventory_quantity]
      周转天数:
        fields_by_dataset:
          物控版库存周转: [inventory_turnaround_days, total_turnaround_days]
        formula_metric: true
        formula_rule: "物控版库存周转的周转天数 = 库存 / 平均日销量。"
    hard_rules:
      - "物控版库存周转最新日期为昨天。"
      - "物控版库存周转日期为区间时，维度必须包含日期天字段。"

  activity_metrics:
    description: "Deals/Coupons活动字段。"
    canonical_terms:
      活动:
        dataset: 活动数据集
        dimensions: [deals_id, deals_title, deals_status, deals_type, promotion_type_name]
      Deals:
        dataset: 活动数据集
      Coupons:
        dataset: 活动数据集
        spelling_rule: "统一写作Coupons"
    metrics: [fee, price, unit_discount, qty, sold, glance_views]
    clarify_when:
      - "用户问活动带来的销售增量，需要联动销售数据，不能只用活动数据集。"

ambiguity_rules:
  - rule_id: "sp_vs_spu"
    trigger_terms: [SP]
    meanings: [Sponsored Products广告, SPU产品编码]
    action: "广告语境识别为SP广告；产品销售语境按即时/账单/综合销售意图处理并校验SPU字段；无法判断时澄清。"

  - rule_id: "sales_amount_vs_ad_sales"
    trigger_terms: [销售额]
    meanings: [销售额, 广告销售额, 总销售额, 分摊销售额]
    action: "根据业务域选择；广告语境优先广告销售额，销售语境优先销售额。"

  - rule_id: "order_time_vs_ship_time"
    trigger_terms: [销售, 销量, 销售额, 趋势]
    meanings: [订单下单时间, 包裹发货时间]
    action: "今日/实时/近几天优先即时销售；月度/季度/年度复盘优先账单销售；用户明确口径时按用户口径。"

  - rule_id: "currency"
    trigger_terms: [金额, 销售额, 广告费, CPC, 成本]
    action: "默认CNY；用户提到原币、美元、USD时使用原币字段。"

  - rule_id: "traffic_conversion_scope"
    trigger_terms: [转化率]
    meanings: [销售主口径转化率, ASIN流量转化率, 广告明细转化率]
    action: "按业务域选择即时综合、流量转化率或广告明细数据集。"

  - rule_id: "inventory_type"
    trigger_terms: [库存]
    meanings: [销售关联库存快照, 物控库存, 库龄, 补货, 库存金额]
    action: "物控、库龄、补货走物控版库存周转；销售联动库存走即时综合快照字段；库存金额口径不明确时需要澄清。"

  - rule_id: "report_period_required"
    trigger_terms: [目录绩效, 搜索词绩效, Search Query, Catalog]
    action: "必须选择报告周期。"

  - rule_id: "non_amazon_ad_detail"
    trigger_terms: [广告明细, 广告活动, 广告组]
    action: "非亚马逊平台只能使用广告费数据集；如字段不支持明细粒度需说明限制。"
