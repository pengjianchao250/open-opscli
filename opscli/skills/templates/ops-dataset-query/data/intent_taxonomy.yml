version: "v1.2"
artifact: "intent_taxonomy"
skill: "ops-dataset-query"
design_principle: "先识别业务意图，再匹配数据集，再校验字段和权限"

intents:
  - intent_id: "ops_comprehensive_monitoring"
    domain: "综合运营域"
    user_intent: "销售、广告、流量、库存联动的综合运营监控"
    trigger_keywords:
      - "综合"
      - "整体"
      - "经营大盘"
      - "运营大盘"
      - "经营健康度"
      - "销售广告库存流量"
      - "运营表现"
    primary_dataset: "即时综合数据集"
    routing_rule: "用于跨销售、广告、流量、库存的联动分析；该数据集以BI系统即时销量趋势为主，补充广告、流量和库存快照相关字段。"
    clarify_when:
      - "用户只问销售、广告、流量、库存单一业务域时，需判断是否应转专项数据集。"

  - intent_id: "realtime_sales_monitoring"
    domain: "销售分析域"
    user_intent: "短期或实时销售监控"
    trigger_keywords:
      - "即时销售"
      - "实时销售"
      - "今日销售"
      - "当天销售"
      - "近几天"
      - "大促"
      - "短期波动"
      - "销售异常"
    primary_dataset: "即时销售数据集"
    routing_rule: "识别为即时销售意图后，按订单下单时间维度分析数据；实际使用即时综合数据集中的 order_sale_trend_set 销售主表口径；后续如开放独立数据集再补 dataset_alias。"
    clarify_when:
      - "用户要求独立即时销售数据集入口时，说明当前实际由即时综合销售主表口径承接。"

  - intent_id: "billing_sales_review"
    domain: "销售分析域"
    user_intent: "长周期账单销售复盘与趋势分析"
    trigger_keywords:
      - "账单销售"
      - "历史销售"
      - "月度"
      - "季度"
      - "年度"
      - "复盘"
      - "预测"
      - "销售趋势"
    primary_dataset: "账单销售数据集"
    routing_rule: "用于月度、季度、年度等长周期销售复盘；以包裹发货时间维度分析数据；实际使用 sale_trend_set，对应账单销售数据集。"
    clarify_when:
      - "用户问今日、实时、大促、短期波动时，应优先识别为即时销售意图。"

  - intent_id: "ads_overall"
    domain: "广告投放域"
    user_intent: "全平台、全广告类型的汇总级广告表现总览"
    trigger_keywords:
      - "广告费"
      - "广告总览"
      - "广告ROI"
      - "广告整体投入"
      - "广告整体效果"
      - "广告预算执行"
      - "广告部门KPI"
      - "跨平台广告"
      - "平台广告对比"
      - "ACOS"
      - "CPC"
      - "点击率"
      - "广告销售额"
    primary_dataset: "广告费数据集"
    routing_rule: "用于全平台、全广告类型的宏观广告总览和跨平台对比；非亚马逊平台广告明细也只能回到广告费数据集查询。发现整体或平台级问题后，可再用广告类型费数据集拆解。"
    clarify_when:
      - "用户要求单广告活动、单关键词、搜索词、投放词或受众组级别分析时，不应直接使用广告费数据集。"

  - intent_id: "ads_type_compare"
    domain: "广告投放域"
    user_intent: "分平台、分广告类型的广告表现对比分析"
    trigger_keywords:
      - "广告类型"
      - "SP对比"
      - "SD对比"
      - "SB对比"
      - "SBV对比"
      - "SP/SD/SB/SBV"
      - "广告结构"
      - "投放结构"
      - "预算分配"
      - "类型ACOS"
      - "类型CPC"
      - "类型转化率"
    primary_dataset: "广告类型费数据集"
    routing_rule: "用于拆解各平台下SP、SD、SB、SBV等广告类型的投入占比和效果差异；适合定位哪类广告效果不佳，不用于广告活动、广告组、关键词或受众组明细。"
    clarify_when:
      - "用户需要公司级跨平台整体广告预算规划时，优先广告费数据集。"
      - "用户需要SP、SD、SB单类型深度明细时，进入对应亚马逊广告明细数据集。"

  - intent_id: "amazon_sp_ads_detail"
    domain: "广告投放域"
    user_intent: "亚马逊SP广告活动与广告组明细分析"
    trigger_keywords:
      - "SP明细"
      - "SP广告"
      - "Sponsored Products"
      - "SP广告活动"
      - "SP广告组"
      - "SP campaign"
    primary_dataset: "SP广告数据集"
    routing_rule: "仅适用于亚马逊平台SP广告活动和广告组明细；不包含搜索词、关键词、投放词数据。"
    clarify_when:
      - "SP可能指SPU时需要澄清。"
      - "用户要求搜索词、关键词、投放词或词组分析时，需要澄清当前SP广告数据集不支持。"

  - intent_id: "amazon_sd_ads_detail"
    domain: "广告投放域"
    user_intent: "亚马逊SD广告明细分析"
    trigger_keywords:
      - "SD明细"
      - "SD广告"
      - "Sponsored Display"
      - "可见展示"
      - "新买家"
      - "加购"
      - "再营销"
    primary_dataset: "SD广告数据集"
    routing_rule: "仅适用于亚马逊平台SD广告明细，适合可见展示、新买家、加购、视频播放、再营销等分析。"
    clarify_when:
      - "点击口径、浏览口径、可见展示口径不明确时需要澄清。"

  - intent_id: "amazon_sb_ads_detail"
    domain: "广告投放域"
    user_intent: "亚马逊SB广告明细分析"
    trigger_keywords:
      - "SB明细"
      - "SB广告"
      - "Sponsored Brands"
      - "品牌广告"
    primary_dataset: "SB广告数据集"
    routing_rule: "仅适用于亚马逊平台SB广告明细；该数据集只包含SB广告相关内容，不包含SBV。"
    clarify_when:
      - "用户问SBV明细时，不使用SB广告数据集，应转广告费或广告类型费做汇总分析。"
      - "用户需要部门、ASIN、SKU维度时，需先校验字段或查询组件。"

  - intent_id: "amazon_sbv_summary"
    domain: "广告投放域"
    user_intent: "亚马逊SBV广告汇总分析"
    trigger_keywords:
      - "SBV"
      - "视频广告"
      - "SBV广告"
    primary_dataset: "广告类型费数据集"
    routing_rule: "SBV不走SB广告数据集明细，只能使用广告类型费数据集或广告费数据集做汇总分析。"
    clarify_when:
      - "用户要求SBV明细时，需要说明当前没有SBV明细数据集。"

  - intent_id: "amazon_sp_sd_ads_detail"
    domain: "广告投放域"
    user_intent: "亚马逊SP+SD合并广告分析"
    trigger_keywords:
      - "SP+SD"
      - "SP和SD合并"
      - "组合投放"
      - "协同效果"
    primary_dataset: "SP+SD广告数据集"
    routing_rule: "仅适用于亚马逊平台SP+SD合并分析；如果只问SP或只问SD，应使用对应单类型数据集。"
    clarify_when:
      - "用户未明确是否需要合并口径时，需要确认。"

  - intent_id: "amazon_sp_sd_sb_ads_detail"
    domain: "广告投放域"
    user_intent: "亚马逊SP+SD+SB全广告类型合并分析"
    trigger_keywords:
      - "SP+SD+SB"
      - "全广告类型"
      - "亚马逊全部广告"
    primary_dataset: "SP+SD+SB广告数据集"
    routing_rule: "仅适用于亚马逊平台SP、SD、SB合并分析；不包含SBV明细。"
    clarify_when:
      - "用户需要SBV明细时，应说明当前不支持。"
      - "用户需要部门、SKU、ASIN维度时，需先校验字段或查询组件。"

  - intent_id: "traffic_conversion"
    domain: "流量转化域"
    user_intent: "ASIN流量与转化分析"
    trigger_keywords:
      - "流量"
      - "Sessions"
      - "浏览量"
      - "转化率"
      - "ASIN转化"
    primary_dataset: "流量转化率数据集"
    routing_rule: "用于ASIN流量、浏览量、转化率分析，最小颗粒度为国家+ASIN+天。"
    clarify_when:
      - "用户问销售主口径转化率时，优先即时综合数据集。"

  - intent_id: "amazon_catalog_performance"
    domain: "流量转化域"
    user_intent: "亚马逊目录绩效分析"
    trigger_keywords:
      - "目录绩效"
      - "Catalog"
      - "目录点击"
      - "目录购买率"
    primary_dataset: "亚马逊目录绩效"
    routing_rule: "用于亚马逊目录曝光、点击、加购、购买表现分析；查询时必须选择报告周期。"
    clarify_when:
      - "用户未提供报告周期时必须澄清。"
      - "用户问搜索词或份额时，应转亚马逊搜索词绩效。"

  - intent_id: "amazon_search_query_performance"
    domain: "流量转化域"
    user_intent: "亚马逊搜索词绩效分析"
    trigger_keywords:
      - "搜索词"
      - "Search Query"
      - "点击份额"
      - "加购份额"
      - "购买份额"
    primary_dataset: "亚马逊搜索词绩效"
    routing_rule: "用于搜索词流量、点击份额、加购份额、购买份额分析；查询时必须选择报告周期。"
    clarify_when:
      - "用户未提供报告周期时必须澄清。"
      - "自然搜索词与广告关键词不明确时需要澄清。"

  - intent_id: "pmc_inventory"
    domain: "库存管理域"
    user_intent: "物控库存、库龄与补货分析"
    trigger_keywords:
      - "物控"
      - "库龄"
      - "补货"
      - "近7天销量"
      - "近30天销量"
    primary_dataset: "物控版库存周转"
    routing_rule: "用于物控库存、库龄、补货计划分析；周转天数=库存/平均日销量；最新日期为昨天；日期区间查询必须包含日期天字段。"
    clarify_when:
      - "物控组织与普通销售组织不明确时需要澄清。"

  - intent_id: "activity_operations"
    domain: "活动运营域"
    user_intent: "Deals/Coupons活动资源与执行分析"
    trigger_keywords:
      - "活动"
      - "Deal"
      - "Deals"
      - "Coupons"
      - "秒杀"
      - "促销"
    primary_dataset: "活动数据集"
    routing_rule: "用于Deals和Coupons活动资源与执行分析；不能直接代表活动销售增量。"
    clarify_when:
      - "用户问活动带来的销售增量时，需要联动销售数据，不能只用活动数据集。"
