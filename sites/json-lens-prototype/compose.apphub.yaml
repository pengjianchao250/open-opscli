# AppHub managed storage: change Dockerfile, not this deployment contract.
services:
  db-init:
    image: docker.io/library/alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    user: 0:0
    network_mode: none
    read_only: true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - FOWNER
    security_opt:
    - no-new-privileges:true
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - 'id="$${APPHUB_APP_ID}"

      case "$$id" in ''''|*[!a-zA-Z0-9]*) exit 1;; esac

      [ "$${#id}" -eq 5 ]

      test ! -L /shared/apphub-databases

      mkdir -p /shared/apphub-databases

      test ! -L "/shared/apphub-databases/$$id"

      mkdir -p "/shared/apphub-databases/$$id"

      chown 1000:1000 "/shared/apphub-databases/$$id"

      chmod 0750 "/shared/apphub-databases/$$id"

      '
    environment:
      APPHUB_APP_ID: ${APPHUB_APP_ID:?}
    volumes:
    - type: volume
      source: apphub-shared
      target: /shared
      volume:
        nocopy: true
    restart: 'no'
    labels:
    - traefik.enable=false
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APPHUB_APP_IMAGE:?}
    container_name: ${APPHUB_CONTAINER_NAME:?}
    user: 1000:1000
    depends_on:
      db-init:
        condition: service_completed_successfully
    env_file:
    - .env
    environment:
      PORT: '8000'
      APP_SLUG: ${APP_SLUG:?}
      SQLITE_PATH: ${APPHUB_SQLITE_PATH:?}
    volumes:
    - type: volume
      source: apphub-shared
      target: /data
      volume:
        nocopy: true
        subpath: apphub-databases/${APPHUB_APP_ID:?}
    networks:
    - apphub
    labels:
    - traefik.enable=true
    - traefik.http.middlewares.gzip.compress=true
    - traefik.http.middlewares.strip-${APP_SLUG:?}.stripprefix.prefixes=/ops-app/${APPHUB_APP_ID:?}/${APP_SLUG:?}
    - traefik.http.routers.http-0-${APP_SLUG:?}.entryPoints=http
    - traefik.http.routers.http-0-${APP_SLUG:?}.rule=Host(`${APPHUB_PUBLIC_HOST:?}`)
      && PathPrefix(`/ops-app/${APPHUB_APP_ID:?}/${APP_SLUG:?}/`)
    - traefik.http.routers.http-0-${APP_SLUG:?}.middlewares=apphub-errors@file,apphub-auth@file,apphub-strip-cookie@file,strip-${APP_SLUG:?}@docker,gzip@docker
    - traefik.http.routers.http-0-${APP_SLUG:?}.service=http-0-${APP_SLUG:?}
    - traefik.http.services.http-0-${APP_SLUG:?}.loadbalancer.server.port=8000
    - traefik.http.routers.hc-${APP_SLUG:?}.entryPoints=http
    - traefik.http.routers.hc-${APP_SLUG:?}.rule=Host(`${APPHUB_PUBLIC_HOST:?}`) &&
      Path(`/ops-app/${APPHUB_APP_ID:?}/${APP_SLUG:?}/__apphub_healthz`)
    - traefik.http.routers.hc-${APP_SLUG:?}.middlewares=apphub-strip-cookie@file,strip-${APP_SLUG:?}@docker
    - traefik.http.routers.hc-${APP_SLUG:?}.service=http-0-${APP_SLUG:?}
    - apphub.managed=true
    - apphub.public_id=${APPHUB_APP_ID:?}
    - apphub.slug=${APP_SLUG:?}
    - apphub.route_contract=root-v1
    - traefik.docker.network=${APPHUB_APP_NETWORK:?}
    restart: unless-stopped
volumes:
  apphub-shared:
    external: true
    name: ${APPHUB_DATABASE_VOLUME:?}
networks:
  apphub:
    external: true
    name: ${APPHUB_APP_NETWORK:?}
