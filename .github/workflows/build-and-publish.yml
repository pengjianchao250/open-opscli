name: Build and Publish to PyPI

on:
  push:
    tags:
      - "v*"          # 推送 v0.0.32 这类 tag 时自动触发
  workflow_dispatch:  # 支持手动触发（调试用）

jobs:
  # ──────────────────────────────────────────────────────────
  # 多平台并行构建 Cython 二进制 wheel
  # ──────────────────────────────────────────────────────────
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # 一个平台失败不影响其他平台继续构建
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheels (cibuildwheel)
        uses: pypa/cibuildwheel@v2.19.0
        env:
          # 覆盖 Python 3.10 ~ 3.13，与 pyproject.toml 的 requires-python>=3.10 对应
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"

          # Linux：跳过 32 位和 Alpine(musl) 版本
          CIBW_SKIP: "*-manylinux_i686 *-musllinux*"

          # macOS：同时编译 Intel (x86_64) 和 Apple Silicon (arm64)
          CIBW_ARCHS_MACOS: "x86_64 arm64"

          # 构建前安装 Cython 和 setuptools（编译依赖）
          CIBW_BEFORE_BUILD: "pip install cython>=3 setuptools>=68 wheel"

          # 简单冒烟测试：确认包可导入
          CIBW_TEST_COMMAND: >
            python -c "import opscli; from opscli import AuthClient; print('import ok')"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          retention-days: 7

  # ──────────────────────────────────────────────────────────
  # 构建 sdist（仅含 __init__.py + 模板数据，不含业务源码）
  # ──────────────────────────────────────────────────────────
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build cython>=3 setuptools>=68

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 7

  # ──────────────────────────────────────────────────────────
  # 汇总所有产物并发布到正式 PyPI
  # ──────────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]   # 必须等待所有构建成功
    runs-on: ubuntu-latest

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "wheels-*"
          merge-multiple: true
          path: dist/

      - name: Download sdist artifact
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: List dist contents
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # PYPI_API_TOKEN 需在 GitHub 仓库 Settings → Secrets 中配置
          password: ${{ secrets.PYPI_API_TOKEN }}
