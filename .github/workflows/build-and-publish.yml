name: Build and Publish to PyPI

on:
  push:
    tags:
      - "v*"          # 推送 v0.0.32 这类 tag 时自动触发
  workflow_dispatch:  # 支持手动触发（调试用）

jobs:
  # ──────────────────────────────────────────────────────────
  # 多平台并行构建 Cython 二进制 wheel
  # ──────────────────────────────────────────────────────────
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # 一个平台失败不影响其他平台继续构建
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up QEMU (Linux only, for aarch64 cross-build)
        # 仅 Linux runner 需要 QEMU 模拟 aarch64；Windows/macOS 跳过
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheels (cibuildwheel)
        uses: pypa/cibuildwheel@v2.21.3
        env:
          # 覆盖 Python 3.10 ~ 3.14
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"

          # 允许构建 prerelease Python 版本
          # 原因：cibuildwheel v2.21.3（2024-11 发布）比 Python 3.14 正式版（2025-10）更早，
          # 内置版本字典将 cp314 标记为 prerelease，不加此标志会被静默跳过（同 cp313 的历史问题）
          CIBW_PRERELEASE_PYTHONS: "1"

          # Linux：跳过 32 位和 Alpine(musl)；aarch64 通过 QEMU 模拟构建，不再跳过
          CIBW_SKIP: "*-manylinux_i686 *-musllinux*"

          # Linux：同时编译 x86_64 和 aarch64（aarch64 由 QEMU 模拟执行）
          CIBW_ARCHS_LINUX: "x86_64 aarch64"

          # macOS：同时编译 Intel (x86_64) 和 Apple Silicon (arm64)
          CIBW_ARCHS_MACOS: "x86_64 arm64"

          # 构建前安装 Cython 和 setuptools（编译依赖）
          CIBW_BEFORE_BUILD: "pip install cython>=3 setuptools>=68 wheel"

          # 发版时按 python-release profile 裁剪内置 Skill 模板
          CIBW_ENVIRONMENT: "OPSCLI_SKILL_PROFILE=python-release"

          # 简单冒烟测试：确认包可导入
          CIBW_TEST_COMMAND: >
            python -c "import opscli; from opscli import AuthClient; print('import ok')"

      - name: Check wheel Skill templates
        run: >
          python scripts/check_skill_release_manifest.py
          --profile python-release
          --artifact wheel
          --dist "wheelhouse/*.whl"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          retention-days: 7

  # ──────────────────────────────────────────────────────────
  # 构建 sdist（仅含 __init__.py + 模板数据，不含业务源码）
  # continue-on-error: true —— sdist 失败不阻塞三平台 wheel 的发版
  # ──────────────────────────────────────────────────────────
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-22.04
    continue-on-error: true   # sdist 非关键路径，失败不影响 wheel 发布
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build cython>=3 setuptools>=68

      - name: Build sdist
        run: OPSCLI_SKILL_PROFILE=python-release python -m build --sdist

      - name: Check sdist Skill templates
        run: >
          python scripts/check_skill_release_manifest.py
          --profile python-release
          --artifact sdist
          --dist "dist/*.tar.gz"

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 7

  # ──────────────────────────────────────────────────────────
  # 汇总所有产物并发布到正式 PyPI
  # 只要三平台 wheel 全部成功即可发布，sdist 失败或取消不阻塞
  # ──────────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    # 只要 build_wheels 未被整体取消即触发发布（允许个别平台 runner 获取失败）
    # twine 使用 --skip-existing，ubuntu 等平台恢复后重跑可自动补充 wheel
    if: ${{ !cancelled() && needs.build_wheels.result != 'cancelled' }}
    runs-on: macos-latest

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "wheels-*"
          merge-multiple: true
          path: dist/

      - name: Download sdist artifact (optional)
        # sdist 可能因 build_sdist 失败而不存在，ignore-not-found 避免发布中断
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/
        continue-on-error: true

      - name: List dist contents
        run: ls -lh dist/

      - name: Set up Python for publish
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Publish to PyPI
        # 直接用最新 twine 上传，彻底绕开 action 内置的旧版 twine（不支持 Metadata-Version 2.4）
        run: |
          pip install --quiet twine
          twine upload dist/* --username __token__ --password "$PYPI_TOKEN" --skip-existing
        env:
          PYPI_TOKEN: ${{ secrets.PIPY_OPEN_OPSCLI }}
