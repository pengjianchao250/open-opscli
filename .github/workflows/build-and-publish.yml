name: Build and Publish to PyPI

on:
  push:
    tags:
      - "v*"          # 推送 v0.0.32 这类 tag 时自动触发
  workflow_dispatch:  # 支持手动触发（调试用）

jobs:
  # ──────────────────────────────────────────────────────────
  # 多平台并行构建 Cython 二进制 wheel
  # ──────────────────────────────────────────────────────────
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # 一个平台失败不影响其他平台继续构建
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheels (cibuildwheel)
        uses: pypa/cibuildwheel@v2.21.3
        env:
          # 覆盖 Python 3.10 ~ 3.14
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"

          # 允许构建 prerelease Python 版本
          # 原因：cibuildwheel v2.21.3（2024-11 发布）比 Python 3.14 正式版（2025-10）更早，
          # 内置版本字典将 cp314 标记为 prerelease，不加此标志会被静默跳过（同 cp313 的历史问题）
          CIBW_PRERELEASE_PYTHONS: "1"

          # Linux：跳过 32 位和 Alpine(musl)
          CIBW_SKIP: "*-manylinux_i686 *-musllinux*"

          # Linux：暂时只编译 x86_64，aarch64 待后续需要时重新开启
          CIBW_ARCHS_LINUX: "x86_64"

          # macOS：同时编译 Intel (x86_64) 和 Apple Silicon (arm64)
          CIBW_ARCHS_MACOS: "x86_64 arm64"

          # Windows：仅编译 64 位 AMD64，弃用 32 位 win32
          # 原因：团队无 32 位 Windows 用户，无需为其产出 wheel，减少构建矩阵与维护成本
          CIBW_ARCHS_WINDOWS: "AMD64"

          # 构建前安装 Cython 和 setuptools（编译依赖）
          CIBW_BEFORE_BUILD: "pip install cython>=3 setuptools>=68 wheel"

          # Linux：修复 wheel 时剥离调试符号
          # 原因：setuptools 在 Linux 下默认带 -g 编译，auditwheel 默认又不 strip，
          # 导致 232 个 .so 的调试符号全部打进 wheel —— 同样内容 macOS 解压后 30 MB，
          # Linux 达 238 MB，manylinux wheel 体积冲到 103~109 MB，超过 PyPI 单文件
          # 100 MB 上限被拒（v0.0.119~v0.0.122 发布失败的根因）。
          # --strip 只去掉调试符号，不影响运行，是 cibuildwheel 官方推荐做法。
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair -w {dest_dir} {wheel} --strip"

          # 发版时按 python-release profile 裁剪内置 Skill 模板
          CIBW_ENVIRONMENT: "OPSCLI_SKILL_PROFILE=python-release"

          # 简单冒烟测试：确认包可导入
          CIBW_TEST_COMMAND: >
            python -c "import opscli; from opscli import AuthClient; print('import ok')"

      - name: Check wheel Skill templates
        run: >
          python scripts/check_skill_release_manifest.py
          --profile python-release
          --artifact wheel
          --dist "wheelhouse/*.whl"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          retention-days: 7

  # ──────────────────────────────────────────────────────────
  # 构建 sdist（仅含 __init__.py + 模板数据，不含业务源码）
  # continue-on-error: true —— sdist 失败不阻塞三平台 wheel 的发版
  # ──────────────────────────────────────────────────────────
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-22.04
    continue-on-error: true   # sdist 非关键路径，失败不影响 wheel 发布
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build cython>=3 setuptools>=68

      - name: Build sdist
        run: OPSCLI_SKILL_PROFILE=python-release python -m build --sdist

      - name: Check sdist Skill templates
        run: >
          python scripts/check_skill_release_manifest.py
          --profile python-release
          --artifact sdist
          --dist "dist/*.tar.gz"

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 7

  # ──────────────────────────────────────────────────────────
  # 汇总所有产物并发布到正式 PyPI
  # 只要三平台 wheel 全部成功即可发布，sdist 失败或取消不阻塞
  # ──────────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    # 只要 build_wheels 未被整体取消即触发发布（允许个别平台 runner 获取失败）
    # twine 使用 --skip-existing，ubuntu 等平台恢复后重跑可自动补充 wheel
    if: ${{ !cancelled() && needs.build_wheels.result != 'cancelled' }}
    runs-on: macos-latest

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "wheels-*"
          merge-multiple: true
          path: dist/

      - name: Download sdist artifact (optional)
        # sdist 可能因 build_sdist 失败而不存在，ignore-not-found 避免发布中断
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/
        continue-on-error: true

      - name: List dist contents
        run: ls -lh dist/

      - name: Check file size limit before upload
        # 上传前先卡一道单文件 100 MB 的门禁，避免"传了一半才失败"。
        # 必要性：twine 是逐个文件顺序上传，中途失败时前面的文件已经落到 PyPI 上，
        # 而 PyPI 的文件名一旦使用过就永久不可复用（删除后重传会报
        # "This filename was previously used by a file that has since been deleted"），
        # 等于把这个版本号彻底废掉、只能跳版本重发。宁可一个都不传，也不要传一半。
        run: |
          limit=$((100 * 1024 * 1024))
          oversized=0
          for f in dist/*; do
            size=$(wc -c < "$f")
            if [ "$size" -gt "$limit" ]; then
              echo "X 超过 PyPI 单文件 100 MB 上限: $f ($((size / 1024 / 1024)) MB)"
              oversized=1
            fi
          done
          if [ "$oversized" -ne 0 ]; then
            echo "已中止上传，未向 PyPI 发送任何文件，本次版本号仍可继续使用。"
            echo "请先缩减产物体积（或申请提高上限）后重新发版。"
            exit 1
          fi
          echo "√ 全部产物均未超过 100 MB"

      - name: Set up Python for publish
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Publish to PyPI
        # 直接用最新 twine 上传，彻底绕开 action 内置的旧版 twine（不支持 Metadata-Version 2.4）
        # --verbose 必须保留：twine 6.x 非 verbose 模式只打印 HTTP 状态短语（如 "400 Bad Request"），
        # 服务端给出的真实拒绝原因（容量超限、文件超大、元数据非法等）只在 verbose 的响应体里，
        # 缺了它会导致发布失败时 CI 日志完全看不出根因（v0.0.119~v0.0.121 即因此排查困难）
        run: |
          pip install --quiet twine
          twine upload dist/* --username __token__ --password "$PYPI_TOKEN" --skip-existing --verbose
        env:
          PYPI_TOKEN: ${{ secrets.PIPY_OPEN_OPSCLI }}
