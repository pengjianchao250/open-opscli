<text x="246.5999999999999" y="1646.375" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">当前宿主可调用 amazon_rufus_get?</text>
<text x="455.19999999999993" y="1838.75" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">调用 amazon_rufus_get</text>
<text x="184.69999999999993" y="1838.75" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">使用 opscli amazon-rufus get 兼容入口</text>
<text x="455.19999999999993" y="1914.75" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">RufusManager.get_backend</text>
<text x="455.20000000000005" y="1990.75" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">读取本地加密 browser-state-COUNTRY.bin</text>
<text x="760.6374999999999" y="128.775" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">storage_state 可用?</text>
<text x="1090.4624999999999" y="292.55" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">从 storage_state 派生 Cookie header</text>
<text x="714.1624999999999" y="989.65" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">返回 RUFUS_SECRET_NOT_READY</text>
<text x="1090.4624999999999" y="368.55" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">HeadlessRufusCaptureService 用 storage_state 打开商品页</text>
<text x="1090.4624999999999" y="536.7750000000001" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">捕获 /rufus/cl/streaming?</text>
<text x="1188.175" y="722" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">HeadlessRufusClient 逐题请求 Rufus SSE</text>
<text x="895.1624999999999" y="722" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">返回 RUFUS_HEADLESS_CAPTURE_ERROR</text>
<text x="1188.175" y="847.325" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">Rufus 请求成功?</text>
<text x="676.5625" y="2142.75" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">AnswerReportWriter 写 output/amazon-rufus 报告</text>
<text x="1113.7624999999998" y="989.65" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">返回 RUFUS_HEADLESS_REQUEST_ERROR</text>
<text x="676.5625" y="2218.75" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">返回 report_path</text>
<text x="895.1624999999999" y="1107.825" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">本轮已刷新登录态?</text>
<text x="1153.0875" y="1243" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">停止恢复并返回错误</text>
<text x="807.1125" y="1243" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">设置 login_recovery_attempted=true</text>
<text x="807.1125" y="1319" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">opscli amazon-rufus init COUNTRY --launch-if-needed</text>
<text x="807.1125" y="1395" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">用户在目标国家站点 Amazon 窗口完成登录</text>
<text x="807.1125" y="1471" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">opscli amazon-rufus save-state COUNTRY</text>
<text x="807.1125" y="1646.375" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">加密保存 Playwright storage_state 到本地</text>
<text x="184.69999999999993" y="1914.75" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">BrowserAttachService 连接本机 Chrome CDP</text>
<text x="184.69999999999993" y="1990.75" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">捕获 seed request</text>
<text x="184.69999999999993" y="2066.75" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">RufusReplayService 在页面上下文逐题请求</text>
