[project]
name = "aukeys-opscli"
version = "0.0.33"
description = "Aukeys 运营 CLI 工具集"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "cryptography>=38",
    "rich>=13",
    "keyring>=25",
    "fastmcp>=2.0",
]

[project.optional-dependencies]
amazon = [
    "playwright>=1.44",
]
seller-sprite = [
    "playwright>=1.44",
    "markdownify>=1.2.2",
]
dev = [
    "pytest>=8",
    "respx>=0.21",
]

[project.scripts]
opscli = "opscli.cli:app"
opscli-mcp = "opscli.mcp.server:run"

[build-system]
# 切换为 setuptools + Cython，支持编译二进制 wheel
requires = ["setuptools>=68", "wheel", "cython>=3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# setuptools 自动发现所有子包
where = ["."]
include = ["opscli*"]
