[project]
name = "aukeys-opscli"
version = "0.1.0"
description = "Aukeys 运营 CLI 工具集"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "cryptography>=38",
    "rich>=13",
    "keyring>=25",
]

[project.optional-dependencies]
amazon = [
    "playwright>=1.44",
]
mcp = [
    "fastmcp>=2.0",
]
dev = [
    "pytest>=8",
    "respx>=0.21",
]

[project.scripts]
opscli = "opscli.cli:app"
opscli-mcp = "opscli.mcp.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opscli"]
