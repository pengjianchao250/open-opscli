[project]
name = "opscli"
version = "0.0.4"
description = "Aukeys 运营 CLI 工具集"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "cryptography>=38",
    "rich>=13",
    "keyring>=25",
]

[project.optional-dependencies]
amazon = [
    "playwright>=1.44",
]
dev = [
    "pytest>=8",
    "respx>=0.21",
]

[project.scripts]
opscli = "opscli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
