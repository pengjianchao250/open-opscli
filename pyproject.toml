[project]
name = "aukeys-opscli"
version = "0.0.125"
description = "Aukeys 运营 CLI 工具集"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    # cryptography 49.0.0 移除了 macOS x86_64/universal2 与 Windows win32 预编译 wheel,
    # Intel Mac 与 32 位 Windows 用户安装时会退化为源码编译(需 Rust+OpenSSL)从而失败;
    # 锁 <49 让其停留在仍带 Intel/win32 wheel 的 48.0.1。属于【铁律15】明确 breaking change 例外。
    "cryptography>=38,<49",
    "rich>=13",
    "keyring>=25",
    "fastmcp>=2.0",
    "fastapi>=0.115",
    "openpyxl>=3.1",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "PyMySQL>=1.1",
]

[project.optional-dependencies]
amazon = [
    "playwright>=1.44",
]
seller-sprite = [
    "playwright>=1.44",
    "patchright>=1.60.1",
    "markdownify>=1.2.2",
    "ddddocr>=1.5.6",
]
dev = [
    "pytest>=8",
    "respx>=0.21",
]

[project.scripts]
opscli = "opscli.cli:run"
opscli-mcp = "opscli.mcp.server:run"
opscli-collector-mcp = "opscli.collector_mcp.server:run"
opscli-collector-monitor = "opscli.collector_monitor.server:run"

[build-system]
# 切换为 setuptools + Cython，支持编译二进制 wheel
requires = ["setuptools>=68", "wheel", "cython>=3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# setuptools 自动发现所有子包
where = ["."]
include = ["opscli*"]
# 排除 Skill 模板目录：其下的 scripts/ 等子目录无 __init__.py，
# 会被 setuptools 命名空间包发现（namespaces 默认为 true）误判为 Python 包，
# 导致模板里的 *.py 被当作"模块"。Cython 生产构建用 BuildPyExcludeSource
# 剥离非白名单模块作源码保护，而这些模板脚本又被排除在 cythonize 之外，
# 两头落空后 scripts/*.py 会从 wheel 中彻底丢失（Windows/macOS wheel 均受影响）。
# 排除后模板文件回归纯 package_data 数据，随 wheel 原样打包，供 skills install 使用。
exclude = ["opscli.skills.templates*"]

[tool.setuptools.package-data]
# Hook 脚本作为资源文件保留（非编译对象，由 settings_injector.py 部署到用户目录）
"opscli" = [
    "skills/hooks/report_skill_usage.py",
]
# 规划器静态资源：领域意图规则与规划合同 schema，经 importlib.resources 读取，
# 非编译对象，必须随 wheel 原样打包
"opscli.query.services.planner.resources" = [
    "*.json",
]
"opscli.collector_monitor" = [
    "wecom-webhook",
]
