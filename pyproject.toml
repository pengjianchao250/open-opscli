[project]
name = "aukeys-opscli"
version = "0.0.141"
description = "Aukeys 运营 CLI 工具集"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    # cryptography 49.0.0 移除了 macOS x86_64/universal2 与 Windows win32 预编译 wheel,
    # Intel Mac 与 32 位 Windows 用户安装时会退化为源码编译(需 Rust+OpenSSL)从而失败;
    # 锁 <49 让其停留在仍带 Intel/win32 wheel 的 48.0.1。属于【铁律15】明确 breaking change 例外。
    "cryptography>=38,<49",
    "rich>=13",
    "keyring>=25",
    "fastmcp>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
amazon = [
    "playwright>=1.44",
]
seller-sprite = [
    "playwright>=1.44",
    "patchright>=1.60.1",
    "markdownify>=1.2.2",
]
dev = [
    "pytest>=8",
    "respx>=0.21",
]

[project.scripts]
opscli = "opscli.cli:app"
opscli-mcp = "opscli.mcp.server:run"

[build-system]
# 切换为 setuptools + Cython，支持编译二进制 wheel
requires = ["setuptools>=68", "wheel", "cython>=3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# setuptools 自动发现所有子包
where = ["."]
include = ["opscli*"]

[tool.setuptools.package-data]
# Hook 脚本作为资源文件保留（非编译对象，由 settings_injector.py 部署到用户目录）
"opscli" = [
    "skills/hooks/report_skill_usage.py",
    "mcp/configs/mcp-quota.json",
]
